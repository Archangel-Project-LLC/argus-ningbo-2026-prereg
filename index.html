 if(a!=null&&a!==0){const hit=Math.abs(Math.abs(a)-w)<=2;s=`<span class="at ${a>0?'m':'x'} ${hit?'hit':'off'}" title="predicted ${w}">${Math.abs(a)}</span>`}
 return s+`<div class="mk">${pc(mk[i])}</div>`}).map(x=>`<td>${x}</td>`).join('')}
const ahead=`<tr><th class="l" rowspan="2">Lifter</th><th class="l" rowspan="2">Nat</th><th class="grp" colspan="4">Snatch</th><th class="grp" colspan="4">Clean &amp; jerk</th></tr><tr><th>1st</th><th>2nd</th><th>3rd</th><th class="hide-m">Most likely</th><th>1st</th><th>2nd</th><th>3rd</th><th class="hide-m">Most likely</th></tr>`;
function arow(r){if(!r.sa)return '';return `<tr class="${r.run?'run':''}"><td class="l">${nm(r)}</td><td class="l">${r.c}</td>${seq(r.sa,r.smk,r.x.slice(0,3))}<td class="hide-m">${r.sq}</td>${seq(r.ca,r.cmk,r.x.slice(3))}<td class="hide-m">${r.cq}</td></tr>`}
function draw(){const F=filt();let h='';
 const groups=(rs,keyf)=>{const g={};rs.forEach(r=>{const k=keyf(r);(g[k]=g[k]||[]).push(r)});return g};
 if(view=='sessions'||view=='attempts'){const g=groups(F,r=>r.t+'|'+r.s+r.k+' '+r.g);
  Object.keys(g).sort().forEach(k=>{const rs=g[k].sort((a,b)=>b.p-a.p),r0=rs[0];
   const body=view=='sessions'?head+rs.map(row).join(''):ahead+rs.map(arow).join('');
   h+=`<div class="sess"><h3>${r0.s=='W'?'Women':'Men'} ${r0.k} kg · Group ${r0.g}<span>${r0.cy} Cyprus · weigh-in 3 h before</span></h3><div class="tw"><table>${body}</table></div></div>`});
  if(view=='attempts')h='<p class="note">Predicted attempt weight, with the predicted chance of making it underneath. Once lifted, the actual weight replaces it: green = within 2 kg of the prediction, red = further out, struck through = missed.</p>'+h}
 if(view=='medals'){const L=ATT?$('#lift').value:'t';const fg={t:['pg','pm'],s:['sg','sm'],c:['cg','cm']}[L];const g=groups(R,r=>r.s+r.k);
  const lname={t:'Total',s:'Snatch',c:'Clean & jerk'}[L];
  const mh=`<tr><th class="l">Lifter</th><th class="l">Nat</th><th>Grp</th><th>${L=='t'?'Pred total':L=='s'?'Exp. snatch':'Exp. C&amp;J'}</th><th>P(gold)</th><th>P(medal)</th><th>Actual</th></tr>`;
  const order=['W49','W53','W57','W61','W69','W77','W86','W+86','M60','M65','M70','M75','M85','M95','M110','M+110'];
  order.filter(k=>g[k]).forEach(k=>{const rs=g[k].filter(r=>r[fg[1]]!=null).sort((a,b)=>b[fg[1]]-a[fg[1]]).slice(0,8);
   h+=`<div class="sess"><h3>${k[0]=='W'?'Women':'Men'} ${k.slice(1)} kg · ${lname}<span>all groups simulated together</span></h3><div class="tw"><table>${mh}${rs.map(r=>`<tr class="${r.run?'run':''}"><td class="l">${nm(r)}</td><td class="l">${r.c}</td><td>${r.g}</td><td>${L=='t'?r.p:L=='s'?r.ps:r.pc}</td><td>${pc(r[fg[0]])}</td><td>${pc(r[fg[1]])}</td><td><b>${r.st?'':(L=='t'?r.a:L=='s'?r.asn:r.acj)??''}</b></td></tr>`).join('')}</table></div></div>`})}
 if(view=='nation'){const g=groups(F,r=>r.c);
  Object.keys(g).sort().forEach(c=>{const rs=g[c].sort((a,b)=>a.t<b.t?-1:1);h+=`<div class="sess"><h3>${c}<span>${rs.length} lifters</span></h3><div class="tw"><table>${head}${rs.map(row).join('')}</table></div></div>`})}
 $('#main').innerHTML=h||'<p class="note">No lifters match.</p>'}
draw();
const mt=(m)=>`<div class="tw"><table><tr><th class="l">Day</th><th>Lifters</th><th class="l">SHA-256</th></tr>${m.map(x=>`<tr><td class="l">${x.day}</td><td>${x.lifters}</td><td class="l"><code>${x.sha256}</code></td></tr>`).join('')}</table></div>`;
$('#verify').innerHTML=`<p>Totals: ${DATA.hash_ok?'<span class="ok">all prediction files match their registered fingerprints</span>':'<span class="no">A PREDICTION FILE NO LONGER MATCHES ITS FINGERPRINT</span>'}</p><p>Each day's predictions are a CSV in the <code>prereg/</code> folder of this repository. Anyone can check them: run <code>shasum -a 256 prereg/*.csv</code> and compare with the list below, which was also sent by email to an independent party on 26 Oct 2026.</p>${mt(DATA.manifest)}`+
(ATT?`<p style="margin-top:16px">Attempt plans: ${DATA.att_ok?'<span class="ok">all attempt files match their registered fingerprints</span>':'<span class="no">AN ATTEMPT FILE NO LONGER MATCHES ITS FINGERPRINT</span>'}</p><p>Files are in <code>prereg/attempts/</code>; check with <code>shasum -a 256 prereg/attempts/*.csv</code>. These fingerprints were also emailed to the same independent party before the first session.</p>${mt(DATA.att_manifest)}`:'');
</script></body></html>
